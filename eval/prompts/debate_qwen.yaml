strategy:
  first_prompt: | 
    Can you answer the question? {question}
    Explain your reasoning. Your final answer should be True or False, in the form \\boxed{{answer}}, at the end of your response.

  debate_prompt: |
    These are the solutions to the problem from other agents: 
    {all_other_response}
    
    Using the solutions from other agents as additional information, can you provide your answer?
    The original question is {question}. 
    Your final answer should be True or False, in the form \\boxed{{answer}}, at the end of your response.

  other_response_prompt: |
    One agent solution: 
    ```{other_response}```


