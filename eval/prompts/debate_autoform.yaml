commonsense:
  first_prompt: |
    Can you answer the following question as accurately as possible?
    {question}

    [FORMAT REQUIREMENTS THAT YOU MUST FOLLOW]
    To enhance clarity and eliminate ambiguities inherent in natural language, consider employing more structured and concise forms of communication for your step-by-step solutions. Suitable formats include code, pseudocode, JSON, markdown tables, logical operators, or mathematical equations. 
    Briefly explain your answer, and write your final choice on a new line.
    The final choice must be enclosed in parentheses, for example ```The answer is (A)```.

  debate_prompt: |
    These are the solutions to the problem from other agents: 
    {all_other_response}
    
    Using the reasoning from other agents as additional advice, can you give an updated answer? 
    Examine your solution and that other agents step by step.
    The origin question is {question}

    [FORMAT REQUIREMENTS THAT YOU MUST FOLLOW]
    To enhance clarity and eliminate ambiguities inherent in natural language, consider employing more structured and concise forms of communication for your step-by-step solutions. Suitable formats include code, pseudocode, JSON, markdown tables, logical operators, or mathematical equations. 
    Briefly explain your answer, and write your final choice on a new line.
    The final choice must be enclosed in parentheses, for example ```The answer is (A)```.
  
  other_response_prompt: |
    One agent solution: 
    ```{other_response}```


