# ── Output ────────────────────────────────────────────────────────────────────
output_dir: ckpt/stage2_dual/
expt_name: stage2_llama
logging_dir: ckpt/stage2_dual/logs
logging_steps: 10
logging_strategy: "steps"
save_strategy: "no"
save_total_limit: 1
save_safetensors: False
report_to: none

# ── Model ─────────────────────────────────────────────────────────────────────
model_name_or_path: meta-llama/Llama-3.2-1B-Instruct  # replace with local path if needed

# Stage 1 checkpoint to initialize from (set to null to train from scratch)
stage1_ckpt_dir: ckpt/stage1/stage1_llama/Llama-3.2-1B-Instruct/ep_3/lr_8e-4/seed_11/

# ── Data ──────────────────────────────────────────────────────────────────────
# Each sample: {messages: [{question_agent1, question_agent2, short_answer, long_answer, mask_inter_res}]}
data_name: /path/to/stage2_data/train.json
max_token_num: 4096

# ── Training ──────────────────────────────────────────────────────────────────
seed: 42
model_max_length: 4096
per_device_train_batch_size: 2
gradient_accumulation_steps: 8
bf16: True
num_train_epochs: 3
learning_rate: 3e-4
max_grad_norm: 2.0
weight_decay: 0.1
warmup_ratio: 0.03
lr_scheduler_type: "cosine"
do_train: True

# ── LoRA ──────────────────────────────────────────────────────────────────────
use_lora: True
lora_r: 128
lora_alpha: 32
lora_dropout: 0.0
lora_init: True

# ── Latent & distillation ─────────────────────────────────────────────────────
num_latent: 6
use_prj: True
prj_dim: 2048
prj_dropout: 0.0

distill_loss_type: smooth_l1
distill_loss_factor: 20
distill_loss_div_std: True
ref_loss_factor: 1.0

# ── Multi-agent dialogue ──────────────────────────────────────────────────────
fixed_num_turns: 2          # number of dialogue turns between the two agents
mask_inter_res: True        # if True, apply loss only on the final turn's answer
include_last_cot: True      # include the last CoT step in the reference signal

# ── Auxiliary decoder loss (optional) ────────────────────────────────────────
use_decode: False           # enable auxiliary decoder loss
decode_loss_factor: 0.0

# ── Misc ──────────────────────────────────────────────────────────────────────
remove_eos: True
exp_mode: False
exp_data_num: 200
print_ref_model_stats: True
