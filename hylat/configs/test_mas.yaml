# Evaluation config for HyLaT Stage 2 agents.
# Used by eval/src/main_latent.py via --conf_path.
#
# Usage (run from the eval/ directory):
#   python -m src.main_latent \
#       --config_file configs/debate.json \
#       --model_name_or_path /path/to/Llama-3.2-1B-Instruct \
#       --dataset commonsense \
#       --method latent_stage2 \
#       --conf_path ../hylat/configs/test_mas.yaml \
#       --output_dir output

# ── Checkpoint ────────────────────────────────────────────────────────────────
ckpt_dir: /path/to/stage2_checkpoint/   # path to the trained Stage 2 checkpoint

# ── Model ─────────────────────────────────────────────────────────────────────
model_name_or_path: meta-llama/Llama-3.2-1B-Instruct  # base LLM (same as training)
model_max_length: 4096

# ── LoRA (must match training config) ────────────────────────────────────────
use_lora: True
lora_r: 128
lora_alpha: 32
lora_init: True

# ── Latent (must match training config) ──────────────────────────────────────
num_latent: 6
use_prj: True
prj_dim: 2048
prj_no_ln: False
prj_dropout: 0.0

# ── Inference ─────────────────────────────────────────────────────────────────
inf_latent_iterations: 6   # number of latent token iterations at inference
inf_num_iterations: 1
batch_size: 16
greedy: True               # use greedy decoding (set False to use temperature sampling)

# ── Misc ──────────────────────────────────────────────────────────────────────
bf16: True
remove_eos: True
seed: 42
