# ── Output ────────────────────────────────────────────────────────────────────
output_dir: ckpt/stage2_hetero/
expt_name: stage2_hetero
logging_dir: ckpt/stage2_hetero/logs
logging_steps: 10
logging_strategy: "steps"
save_strategy: "no"
save_total_limit: 1
save_safetensors: False
report_to: none

# ── Models ────────────────────────────────────────────────────────────────────
model_name_or_path: meta-llama/Llama-3.2-1B-Instruct   # Agent 1 backbone
model2_name_or_path: Qwen/Qwen2-1.5B-Instruct          # Agent 2 backbone

# Stage 1 checkpoints (one per backbone; set to null to skip)
stage1_ckpt_dir: ckpt/stage1/Llama-3.2-1B-Instruct/ep_3/lr_3e-4/seed_11/
stage1_ckpt_dir2: ckpt/stage1/Qwen2-1.5B-Instruct/ep_3/lr_5e-5/seed_11/

# ── Data ──────────────────────────────────────────────────────────────────────
# Each sample: {messages: [{question_agent1, question_agent2, short_answer, long_answer, mask_inter_res}]}
data_name: /path/to/stage2_data/train.json
max_token_num: 4096

# ── Training ──────────────────────────────────────────────────────────────────
seed: 42
model_max_length: 4096
per_device_train_batch_size: 1
gradient_accumulation_steps: 16
bf16: True
num_train_epochs: 3
learning_rate: 1e-4
max_grad_norm: 2.0
weight_decay: 0.1
warmup_ratio: 0.05
lr_scheduler_type: "cosine"
do_train: True

# ── LoRA (per backbone) ───────────────────────────────────────────────────────
use_lora: True
lora_init: True
lora_r: 128           # Agent 1 (Llama) LoRA rank
lora_alpha: 32
lora_r2: 64           # Agent 2 (Qwen) LoRA rank
lora_alpha2: 16
lora_dropout: 0.05

# Optionally freeze one backbone and only train its adapter
freeze_model1: False
freeze_model2: False

# ── Cross-model adapter ───────────────────────────────────────────────────────
# adapter_hidden_dim: 0  → linear + LayerNorm (lightweight)
# adapter_hidden_dim: N  → 2-layer MLP with GELU + LayerNorm (expressive)
adapter_hidden_dim: 2048
adapter_lr: 1e-3      # adapters are trained from scratch; use higher lr than backbone

# ── Latent & distillation ─────────────────────────────────────────────────────
num_latent: 6
use_prj: True
prj_dim: 2048         # Agent 1 projection dim (should match its stage1 config)
prj_dim2: 1536        # Agent 2 projection dim (should match its stage1 config)
prj_dropout: 0.0

distill_loss_type: smooth_l1
distill_loss_factor: 20
distill_loss_div_std: True
ref_loss_factor: 1.0

# ── Multi-agent dialogue ──────────────────────────────────────────────────────
fixed_num_turns: 2
mask_inter_res: True        # if True, apply loss only on the final turn's answer
include_last_cot: True

# ── Auxiliary decoder loss (optional) ────────────────────────────────────────
use_decode: False
decode_loss_factor: 0.0

# ── Misc ──────────────────────────────────────────────────────────────────────
remove_eos: True
exp_mode: False
exp_data_num: 100
print_ref_model_stats: True
